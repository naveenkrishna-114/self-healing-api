[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-api"
version = "0.1.0"
description = "A reusable Python package for reliable API communication and controlled automated failure recovery"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Naveen Krishna" }
]
keywords = [
    "api", "resilience", "retry", "circuit-breaker", "fallback",
    "timeout", "health-check", "rate-limiting", "observability"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

# Core runtime dependency — only one required
dependencies = [
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
# Optional observability integrations
opentelemetry = [
    "opentelemetry-api>=1.20.0,<2.0",
    "opentelemetry-sdk>=1.20.0,<2.0",
]
prometheus = [
    "prometheus-client>=0.19.0,<1.0",
]
# Optional AI compatibility assistant
ai = [
    "openai>=1.0.0,<2.0",
]
# All optional extras together
full = [
    "opentelemetry-api>=1.20.0,<2.0",
    "opentelemetry-sdk>=1.20.0,<2.0",
    "prometheus-client>=0.19.0,<1.0",
    "openai>=1.0.0,<2.0",
]
# Development and testing tools
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/naveenkrishna-114/self-healing-api"
Documentation = "https://github.com/naveenkrishna-114/self-healing-api#readme"
Repository = "https://github.com/naveenkrishna-114/self-healing-api"
"Bug Tracker" = "https://github.com/naveenkrishna-114/self-healing-api/issues"
Changelog = "https://github.com/naveenkrishna-114/self-healing-api/blob/main/CHANGELOG.md"

# ── Package discovery ────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"self_healing_api" = ["py.typed"]

# ── Pytest configuration ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that use mock HTTP servers",
    "concurrency: tests that verify thread/async safety",
    "security: tests that verify secret handling and TLS",
    "chaos: tests that inject failures",
    "performance: benchmark tests",
]

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "T20", # flake8-print
    "RUF", # ruff-specific
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # do not perform function calls in default arguments
    "RUF022", # allow logical grouping in __all__
    "S110",  # allow try-except-pass when intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"src/self_healing_api/retry/jitter.py" = ["S311"]
"src/self_healing_api/routing/router.py" = ["S311"]

# ── Mypy (static type checking) ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/self_healing_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
